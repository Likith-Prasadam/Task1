name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install flake8 pytest flask

      - name: Run Lint
        run: flake8 .

      - name: Run Tests
        run: pytest

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t myapp:${{ github.sha }} .

      - name: Tag Image
        run: |
          docker tag myapp:${{ github.sha }} \
          ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}

            docker stop myapp || true
            docker rm myapp || true

            docker run -d \
            --name myapp \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}
