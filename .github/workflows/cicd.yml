name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: v${{ github.run_number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 .

      - name: Run Pytest
        run: |
          pytest -v

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:${IMAGE_TAG} .

      - name: Push Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:${IMAGE_TAG}

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            NEW_VERSION="v${{ github.run_number }}"
            OLD_VERSION="${{ secrets.PREVIOUS_IMAGE_TAG }}"

            echo "Deploying $NEW_VERSION"
            echo "Rollback target $OLD_VERSION"

            sudo docker pull \
            ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:$NEW_VERSION

            sudo docker stop flask-app || true
            sudo docker rm flask-app || true

            sudo docker run -d \
              --name flask-app \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:$NEW_VERSION

            sleep 15

            RESPONSE=$(curl -s http://localhost:5000)

            echo "Response: $RESPONSE"

            if [[ "$RESPONSE" != *"Application Healthy"* ]]
            then

              echo "Health Check Failed"
              echo "Rolling back..."

              sudo docker stop flask-app || true
              sudo docker rm flask-app || true

              sudo docker pull \
              ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:$OLD_VERSION

              sudo docker run -d \
                --name flask-app \
                -p 5000:5000 \
                ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:$OLD_VERSION

              exit 1

            fi

            echo "Deployment Successful"

      - name: Success Status
        if: success()
        run: |
          echo "Deployment Successful" >> $GITHUB_STEP_SUMMARY

      - name: Failure Status
        if: failure()
        run: |
          echo "Deployment Failed - Rollback Executed" >> $GITHUB_STEP_SUMMARY
