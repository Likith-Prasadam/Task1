name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 .

      - name: Run Pytest
        run: |
          pytest -v

      - name: Login To DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:latest .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:latest

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "Saving current running image as backup..."

            CURRENT_IMAGE=$(sudo docker inspect flask-app --format='{{.Config.Image}}' 2>/dev/null || true)

            if [ ! -z "$CURRENT_IMAGE" ]; then
              sudo docker tag $CURRENT_IMAGE backup-image
            fi

            echo "Pulling latest image..."

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:latest

            echo "Stopping old container..."

            sudo docker stop flask-app || true
            sudo docker rm flask-app || true

            echo "Starting new container..."

            sudo docker run -d \
              --name flask-app \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/task1-flask-app:latest

            echo "Waiting for application..."

            sleep 15

            RESPONSE=$(curl -s http://localhost:5000)

            echo "Application Response: $RESPONSE"

            if [[ "$RESPONSE" != *"Application Healthy"* ]]
            then

              echo "Health Check Failed"
              echo "Starting Rollback..."

              sudo docker stop flask-app || true
              sudo docker rm flask-app || true

              sudo docker run -d \
                --name flask-app \
                -p 5000:5000 \
                backup-image

              echo "Rollback Completed"

              exit 1

            fi

            echo "Health Check Passed"

      - name: Deployment Success
        if: success()
        run: |
          echo "Deployment Successful" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "Deployment Failed - Rollback Executed" >> $GITHUB_STEP_SUMMARY
